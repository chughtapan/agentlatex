name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: cmp latex/agentedit.sty plugins/agentedit-guard/latex/agentedit.sty
      - run: cmp BOOTSTRAP.md plugins/agentedit-guard/BOOTSTRAP.md
      - run: python3 -m unittest discover -s tests -v

  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y texlive-latex-base
      - working-directory: examples
        run: |
          TEXINPUTS=../latex: pdflatex -interaction=nonstopmode -halt-on-error example.tex
      - working-directory: examples
        run: |
          if TEXINPUTS=../latex: pdflatex -interaction=nonstopmode strict-example.tex; then
            echo "strict validation unexpectedly succeeded"
            exit 1
          fi
          test -f strict-example.pdf
          grep -q "AGENT-EDIT-MARKER: strict-example" strict-example.log

  emacs-built-in:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs-version: ["29.4", "30.2"]
    steps:
      - uses: actions/checkout@v6
      - uses: purcell/setup-emacs@bdc64dc730ae1fcba200bfd52cb1b4cf6159cbe5
        with:
          version: ${{ matrix.emacs-version }}
      - name: Test built-in TeX modes
        run: |
          emacs --batch -Q -L emacs \
            -l tests/emacs/agentedit-review-tests.el \
            -f ert-run-tests-batch-and-exit

  emacs-auctex:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs-version: ["29.4", "30.2"]
        auctex-version: ["14.1.0", "14.1.2"]
    steps:
      - uses: actions/checkout@v6
      - uses: purcell/setup-emacs@bdc64dc730ae1fcba200bfd52cb1b4cf6159cbe5
        with:
          version: ${{ matrix.emacs-version }}
      - name: Download AUCTeX ${{ matrix.auctex-version }}
        run: |
          sudo apt-get update
          sudo apt-get install -y lzip
          if [ "${{ matrix.auctex-version }}" = "14.1.0" ]; then
            curl --fail --location --retry 3 \
              https://elpa.gnu.org/packages/auctex-14.1.0.tar.lz \
              --output /tmp/auctex.tar.lz
            echo "1b3d512e0547e286785a3ae8dd30f63ed4523c5a680f51acc272e3c58f30d7e0  /tmp/auctex.tar.lz" \
              | sha256sum --check
            lzip --decompress --stdout /tmp/auctex.tar.lz \
              > /tmp/auctex.tar
          else
            curl --fail --location --retry 3 \
              https://elpa.gnu.org/packages/auctex-14.1.2.tar \
              --output /tmp/auctex.tar
            echo "3772e96a16781cc795c27355b63a09bb67ca963acd7ec65294e694aaa22ee936  /tmp/auctex.tar" \
              | sha256sum --check
          fi
      - name: Install AUCTeX ${{ matrix.auctex-version }} as an Emacs package
        run: |
          emacs --batch -Q \
            --eval '(setq package-user-dir "/tmp/agentlatex-elpa")' \
            --eval '(require (quote package))' \
            --eval '(package-install-file "/tmp/auctex.tar")'
      - name: Test AUCTeX ${{ matrix.auctex-version }} mode
        env:
          AGENTEDIT_TEST_AUCTEX: "1"
        run: |
          emacs --batch -Q \
            --eval '(setq package-user-dir "/tmp/agentlatex-elpa")' \
            --eval '(require (quote package))' \
            --eval '(package-initialize)' \
            -L emacs \
            -l tests/emacs/agentedit-review-tests.el \
            -f ert-run-tests-batch-and-exit
